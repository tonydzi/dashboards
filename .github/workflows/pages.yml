# Выкладка витрины дашбордов как ЕСТЬ, без Jekyll.
#
# Зачем: старый сборщик Pages (build_type=legacy) с 06.08.2026 отвечал только
# «Page build failed» без единой строки причины -- шесть отказов подряд, и диагностировать
# было нечем. Actions на том же содержимом даёт настоящий журнал сборки.
# Откат: вернуть build_type=legacy через API Pages, этот файл можно оставить.
name: Deploy dashboards to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Пушут несколько машин: не отменяем уже идущую выкладку, ставим в очередь.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
