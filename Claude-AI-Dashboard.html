 ['Чатов',S.chats],['Артефактов',S.arts],['Проектов',S.projs],['Док. знаний',S.docs],['Символов',fmt(S.chars)]
].map(k=>`<div class="kpi"><div class="n">${typeof k[1]==='number'?fmt(k[1]):k[1]}</div><div class="l">${k[0]}</div></div>`).join('');
const mx=Math.max(...D.months.map(m=>m[1]),1);
document.getElementById('bars').innerHTML=D.months.map(m=>
 `<div class="bar"><div class="v">${m[1]}</div><div class="b" style="height:${Math.round(m[1]/mx*110)}px"></div><div>${m[0].slice(2)}</div></div>`).join('');
const ps=document.getElementById('proj');
ps.innerHTML='<option value="">все проекты</option>'+D.projects.map(p=>`<option value="${p[0]}">${p[0]} (${p[1]})</option>`).join('');
function setTab(t){tab=t;document.getElementById('tabChats').className=t==='chats'?'on':'';document.getElementById('tabArts').className=t==='arts'?'on':'';document.getElementById('onlyArt').style.display=t==='chats'?'':'none';render()}
function toggleArt(){onlyArt=!onlyArt;document.getElementById('onlyArt').className=onlyArt?'on':'';render()}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1}render()}
function render(){
 const q=document.getElementById('q').value.toLowerCase(), pf=document.getElementById('proj').value;
 const view=document.getElementById('view');
 if(tab==='chats'){
  let r=D.rows.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!pf||x.project===pf)&&(!onlyArt||x.arts>0));
  r.sort((a,b)=>{let A=a[sortKey],B=b[sortKey];return (A<B?-1:A>B?1:0)*sortDir});
  document.getElementById('count').textContent=`${r.length} чатов`;
  view.innerHTML=`<table><thead><tr>
   <th onclick="sortBy('date')">Дата</th><th onclick="sortBy('name')">Название</th>
   <th onclick="sortBy('project')">Проект</th><th onclick="sortBy('msgs')">Сообщ.</th>
   <th onclick="sortBy('arts')">Арт.</th></tr></thead><tbody>`+
   r.map(x=>`<tr><td class="muted">${x.date}</td>
    <td><a href="${x.url}" target="_blank">${esc(x.name)}</a></td>
    <td>${x.project?`<span class="pill">${esc(x.project)}</span>`:''}</td>
    <td class="muted">${x.msgs}</td>
    <td>${x.arts?`<span class="art">${x.arts}</span>`:'<span class="muted">—</span>'}</td></tr>`).join('')+`</tbody></table>`;
 } else {
  let r=D.arts.filter(x=>(!q||x.title.toLowerCase().includes(q)||(x.conv||'').toLowerCase().includes(q))&&(!pf||x.project===pf));
  document.getElementById('count').textContent=`${r.length} артефактов`;
  view.innerHTML=`<table><thead><tr><th>Дата</th><th>Артефакт</th><th>Тип</th><th>Из чата</th></tr></thead><tbody>`+
   r.map(x=>`<tr><td class="muted">${x.date}</td><td><b>${esc(x.title)}</b></td>
    <td class="muted">${esc((x.type||'').replace('application/vnd.ant.',''))}</td>
    <td class="muted">${esc(x.conv)}</td></tr>`).join('')+`</tbody></table>`;
 }
}
render();
</script></body></html>
